<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
      .handwritten-as { font-family: 'Caveat', cursive; font-weight: 700; font-size: 58px; fill: #0066FF; }
      .handwritten-title { font-family: 'Caveat', cursive; font-weight: 700; font-size: 24px; fill: #0066FF; }
    </style>
    <linearGradient id="pwa_chainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#BF953F" />
      <stop offset="25%" stopColor="#FCF6BA" />
      <stop offset="50%" stopColor="#B38728" />
      <stop offset="75%" stopColor="#FBF5B7" />
      <stop offset="100%" stopColor="#AA771C" />
    </linearGradient>
    <clipPath id="pwa_appIconClip">
      <rect x="0" y="0" width="120" height="120" rx="28" />
    </clipPath>
  </defs>

  <g clipPath="url(#pwa_appIconClip)">
    <rect x="0" y="0" width="120" height="120" fill="white" />

    <!-- Scaled down by extra 1.3x -> 0.59 / 1.3 = 0.4538 -->
    <g transform="translate(60, 60) scale(0.45) translate(-60, -60)">
      
      <!-- Central AS and Chain -->
      <g transform="translate(63, 40) scale(1) translate(-50, -50)">
        <g stroke-width="1.2" stroke="url(#pwa_chainGradient)" fill="none">
          <ellipse cx="28" cy="28" rx="3.5" ry="1.5" transform="rotate(45 28 28)" />
          <ellipse cx="29.2" cy="27.2" rx="3.5" ry="1.5" transform="rotate(-45 29.2 27.2)" />
          <ellipse cx="30.4" cy="26.4" rx="3.5" ry="1.5" transform="rotate(45 30.4 26.4)" />
          <ellipse cx="31.6" cy="25.6" rx="3.5" ry="1.5" transform="rotate(-45 31.6 25.6)" />
          <ellipse cx="32.8" cy="24.8" rx="3.5" ry="1.5" transform="rotate(45 32.8 24.8)" />
          <ellipse cx="34" cy="24" rx="3.5" ry="1.5" transform="rotate(-45 34 24)" />
          <ellipse cx="35.2" cy="23.2" rx="3.5" ry="1.5" transform="rotate(45 35.2 23.2)" />
          <ellipse cx="36.4" cy="22.4" rx="3.5" ry="1.5" transform="rotate(-45 36.4 22.4)" />

          <ellipse cx="34" cy="34" rx="4" ry="2" transform="rotate(-14 34 34)" />
          <ellipse cx="31" cy="35" rx="4" ry="2" transform="rotate(75 31 35)" />
          <ellipse cx="28" cy="36" rx="4" ry="2" transform="rotate(-14 28 36)" />
          <ellipse cx="25" cy="37" rx="4" ry="2" transform="rotate(75 25 37)" />
          <ellipse cx="22" cy="38" rx="4" ry="2" transform="rotate(-15 22 38)" />
          <ellipse cx="19" cy="39" rx="4" ry="2" transform="rotate(74 19 39)" />
          <ellipse cx="16" cy="40" rx="4" ry="2" transform="rotate(-16 16 40)" />
          <ellipse cx="13" cy="40.7" rx="4" ry="2" transform="rotate(72 13 40.7)" />
          <ellipse cx="10" cy="41.3" rx="4" ry="2" transform="rotate(-17 10 41.3)" />

          <ellipse cx="28" cy="28" rx="4" ry="2" transform="rotate(-60 28 28)" />
          <ellipse cx="26.6" cy="26.1" rx="4" ry="2" transform="rotate(30.7 26.6 26.1)" />
          <ellipse cx="25.2" cy="24.2" rx="4" ry="2" transform="rotate(-58.4 25.2 24.2)" />
          <ellipse cx="23.6" cy="22.3" rx="4" ry="2" transform="rotate(32.2 23.6 22.3)" />
          <ellipse cx="22" cy="20.5" rx="4" ry="2" transform="rotate(-57.1 22 20.5)" />
          <ellipse cx="20.3" cy="18.8" rx="4" ry="2" transform="rotate(33.3 20.3 18.8)" />
          <ellipse cx="18.5" cy="17.1" rx="4" ry="2" transform="rotate(-56.2 18.5 17.1)" />
          <ellipse cx="16.5" cy="15.5" rx="4" ry="2" transform="rotate(33.9 16.5 15.5)" />
          <ellipse cx="14.4" cy="14" rx="4" ry="2" transform="rotate(-56 14.4 14)" />
          <ellipse cx="12" cy="12.5" rx="4" ry="2" transform="rotate(33.8 12 12.5)" />
          <ellipse cx="9.6" cy="11.1" rx="4" ry="2" transform="rotate(-56.3 9.6 11.1)" />
          <ellipse cx="7" cy="9.8" rx="4" ry="2" transform="rotate(33.2 7 9.8)" />
        </g>
        
        <text x="65" y="80" class="handwritten-as" text-anchor="middle">AS</text>
      </g>
      
      <text x="60" y="110" class="handwritten-title" text-anchor="middle">AlphaSpace</text>
    </g>
