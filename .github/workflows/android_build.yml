name: Build Android App (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Build Android Package (Simulated)
        run: |
          mkdir -p output
          # AAB fayli (Play Market uchun)
          echo "Bu AAB fayli (Play Market uchun)" > output/app-release-bundle.aab
          # APK fayli (Telegram/Direct install uchun)
          echo "Bu APK fayli (Telegram orqali tarqatish uchun)" > output/app-release.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-assets
          path: output/*
