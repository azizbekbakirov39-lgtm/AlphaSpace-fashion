name: Build Android App (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Web App
        run: |
          npm install
          npm run build

      # Bu qadamda Bubblewrap orqali APK/AAB generatsiya qilinadi.
      # Buning uchun sizga 'twa-manifest.json' fayli kerak bo'ladi.
      # Hozircha faqat tushuntirish beraman, chunki sign qilish uchun keystore kerak.
      - name: Build Android Package
        run: |
          # Headless muhitda bubblewrap ishlatish uchun setup
          # Bu yerda real loyihada 'bubblewrap build' ishlatiladi.
          # Hozircha namunaviy fayl yaratamizki, workflow ishlashini tekshirish uchun.
          touch app-release-bundle.aab
          echo "Sample AAB for demonstration" > app-release-bundle.aab

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-app-bundle
          path: ./*.aab
          if-no-files-found: error
