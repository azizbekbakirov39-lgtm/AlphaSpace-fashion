name: Build Android App (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Build Android Package (Simulated)
        run: |
          mkdir -p output
          # Kelajakda haqiqiy AAB yaratish uchun:
          # npx @bubblewrap/cli build --no-interactive
          echo "Bu ilovangizning AAB fayli bo'ladi. Uni Play Marketga yuklash uchun imzolash kerak." > output/app-release-bundle.aab

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: output/*.aab
