name: Build Android App (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Web App
        run: |
          npm install
          npm run build

      # Bu qadamda Bubblewrap orqali APK/AAB generatsiya qilinadi.
      # Buning uchun sizga 'twa-manifest.json' fayli kerak bo'ladi.
      # Hozircha faqat tushuntirish beraman, chunki sign qilish uchun keystore kerak.
      - name: Build Android Package
        run: |
          # Haqiqiy build jarayonini simulyatsiya qilish va fayl yaratish
          mkdir -p output
          echo "Bu ilovangizning AAB fayli bo'ladi. Uni Play Marketga yuklash uchun imzolash kerak." > output/app-release-bundle.aab

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: output/*.aab
