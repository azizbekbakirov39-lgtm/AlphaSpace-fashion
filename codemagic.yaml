workflows:
  android-twa-workflow:
    name: Android TWA Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web App
        script: npm run build
      - name: Install Bubblewrap CLI
        script: npm install -g @bubblewrap/cli
      - name: Build Android Package
        script: |
          # Bubblewrap build jarayoni
          yes | bubblewrap init --manifest=twa-manifest.json || echo "Init skip"
          bubblewrap build --no-interactive
          
          # Fayllarni topish va asosiy papkaga nusxalash (Codemagic ularni ko'rishi uchun)
          echo "Hosil bo'lgan fayllarni qidirish..."
          find . -maxdepth 4 -name "*.apk" -exec cp {} . \;
          find . -maxdepth 4 -name "*.aab" -exec cp {} . \;
          
          # Natijani tekshirish
          echo "Asosiy papkadagi fayllar listi:"
          ls -lh *.apk *.aab || echo "Xato: Fayllar topilmadi!"
    artifacts:
      - "*.apk"
      - "*.aab"
      - "**/*.apk"
      - "**/*.aab"
      - "**/*.apk"
      - "**/*.aab"
    publishing:
      email:
        recipients:
          - azizbekbakirov39@gmail.com
