workflows:
  android-twa-workflow:
    name: Android TWA Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web App
        script: npm run build
      - name: Install Bubblewrap CLI
        script: npm install -g @bubblewrap/cli
      - name: Build Android Package
        script: |
          # Unsigned build for testing
          yes | bubblewrap build --no-interactive || echo "Build finished"
    artifacts:
      - "*.apk"
      - "*.aab"
    publishing:
      email:
        recipients:
          - azizbekbakirov39@gmail.com
