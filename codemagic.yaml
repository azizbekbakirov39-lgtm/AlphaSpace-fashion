workflows:
  android-twa-workflow:
    name: Android TWA Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web App
        script: npm run build
      - name: Install Bubblewrap CLI
        script: npm install -g @bubblewrap/cli
      - name: Build Android Package
        script: |
          # Bubblewrap loyihasini manifest orqali import qilish yoki yangilash
          # Agar loyiha hali yaratilmagan bo'lsa, uni init qilamiz
          if [ ! -f "twa-manifest.json" ]; then
            echo "Xato: twa-manifest.json topilmadi!"
            exit 1
          fi
          
          # Loyihani yaratish (avtomatik javoblar bilan)
          yes | bubblewrap init --manifest=twa-manifest.json || echo "Loyiha allaqachon mavjud bo'lishi mumkin"
          
          # Build jarayoni
          bubblewrap build --no-interactive
          
          # Qaysi fayllar yaratilganini ko'rish va ularni rootga nusxalash
          echo "Quyidagi fayllar topildi:"
          find . -maxdepth 4 -name "*.apk" -o -name "*.aab"
          cp $(find . -name "*.apk") . || echo "APK topilmadi"
          cp $(find . -name "*.aab") . || echo "AAB topilmadi"
    artifacts:
      - "*.apk"
      - "*.aab"
      - "**/*.apk"
      - "**/*.aab"
    publishing:
      email:
        recipients:
          - azizbekbakirov39@gmail.com
